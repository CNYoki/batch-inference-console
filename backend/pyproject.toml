[project]
name = "batch-inference-console-backend"
version = "0.1.0"
description = "Batch inference platform backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncmy>=0.2.9",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.17",
    "httpx>=0.27",
    "redis>=5.2",
    "authlib>=1.3",
    "pyjwt[crypto]>=2.9",
    "bcrypt>=4.2",
    "cryptography>=43",
    "python-dotenv>=1.0",
    "aiofiles>=24.1",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    # 只用于测试「生成的脚本读取 parquet」这条路径；运行时后端不依赖它
    "pyarrow>=17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "BLE", "RUF"]
ignore = [
    "E501",     # 行长由 formatter 控制
    "RUF001",   # 中文注释里的全角标点不是笔误
    "RUF002",
    "RUF003",
    "B008",     # FastAPI 的 File()/Depends() 就是要在默认值里调用
    "UP042",    # 刻意用 str+Enum 而非 StrEnum：str(x) 保持 "JobStatus.queued" 便于日志排查
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # conftest 必须先设环境变量再导入 app

[tool.pytest.ini_options]
asyncio_mode = "auto"
